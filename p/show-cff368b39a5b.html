<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Second Chances Show Screen</title>
<style>
:root{--bg:#120a1c;--bg2:#2a0f3a;--pink:#ff3fa4;--gold:#ffd166;--ink:#fff;--mute:#c9b6d9;--red:#ff4d5e}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,"SF Pro Display","Segoe UI",Helvetica,Arial,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;background:radial-gradient(120% 90% at 50% 0%,var(--bg2),var(--bg) 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:5vmin 6vmin 8vmin}
.scene{display:none;width:100%;height:100%;flex-direction:column;align-items:center;justify-content:center;gap:2.6vmin}
.scene.on{display:flex;animation:in .5s ease}
@keyframes in{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
.tag{font-size:2.6vmin;letter-spacing:.4em;text-transform:uppercase;color:var(--pink);font-weight:800}
.time{font-size:2.6vmin;color:var(--mute);letter-spacing:.15em}
h1{font-size:9vmin;line-height:1.05;font-weight:900;letter-spacing:-.02em}
h2{font-size:7vmin;line-height:1.1;font-weight:850}
.big{font-size:5.2vmin;line-height:1.3;max-width:86vw;font-weight:600}
.mid{font-size:3.6vmin;line-height:1.35;color:var(--mute);max-width:80vw}
.gold{color:var(--gold)}.pink{color:var(--pink)}
.count{font-variant-numeric:tabular-nums;font-size:14vmin;font-weight:900;letter-spacing:.02em;line-height:1}
.count.hot{color:var(--red);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.55}}
.next{font-size:2.8vmin;color:var(--mute)}
.pausebar{position:fixed;top:0;left:0;right:0;background:var(--red);color:#fff;font-weight:900;font-size:3.2vmin;letter-spacing:.2em;padding:1.4vmin;text-align:center;display:none;z-index:5}
.pausebar.show{display:block}
/* evidence cards */
.card{background:#1b1526;border:.5vmin solid #3b2c52;border-radius:2.4vmin;padding:3.2vmin 4vmin;text-align:left;max-width:88vw}
.discord{background:#313338;border-radius:2vmin;padding:3vmin 4vmin;text-align:left;font-size:3.6vmin;line-height:1.5;width:min(82vw,150vmin)}
.discord .d{color:#949ba4;font-size:2.4vmin;text-align:center;border-bottom:1px solid #3f4147;margin-bottom:2vmin;padding-bottom:1vmin}
.discord b{color:#fff}.discord .dim{color:#949ba4}
.news{background:linear-gradient(90deg,#b00020,#e0143c);border-radius:1.6vmin;padding:1.4vmin 3vmin;font-weight:900;letter-spacing:.3em;font-size:3vmin}
.chat{background:#0e0e10;border:1px solid #2d2d33;border-radius:1.6vmin;width:min(84vw,160vmin);height:62vh;text-align:left;padding:2vmin 3vmin;font-size:2.9vmin;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.chat div.m{padding:.5vmin 0;animation:in .3s}
.chat .u{font-weight:800;margin-right:1.2vmin}
.chat .ts{color:#7d7d85;margin-right:1.2vmin;font-size:2.4vmin}
.chat .end{text-align:center;color:var(--red);font-weight:900;letter-spacing:.3em;padding-top:1.6vmin}
.ig{background:linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045);padding:.7vmin;border-radius:3vmin}
.ig div{background:#150d20;border-radius:2.6vmin;padding:3.4vmin 4.4vmin;font-size:4.6vmin;font-weight:700;max-width:80vw}
/* queue */
.qgrid{display:grid;grid-template-columns:18vmin repeat(3,1fr);gap:1.2vmin;width:min(94vw,190vmin);font-size:3.4vmin}
.qgrid .h{font-size:2.6vmin;color:var(--pink);font-weight:800;letter-spacing:.2em;padding:.8vmin}
.qgrid .r{color:var(--mute);font-size:2.4vmin;align-self:center;text-align:left;line-height:1.25}
.qgrid .n{background:#1b1526;border-radius:1.6vmin;padding:1.6vmin;font-weight:800;border:.4vmin solid transparent}
.qgrid .cur{background:var(--pink);color:#fff;border-color:#fff;transform:scale(1.04)}
.qgrid .done{opacity:.28}
.qctl{display:flex;gap:2vmin;align-items:center;margin-top:1vmin}
.btn{background:#3b2c52;color:#fff;border:0;border-radius:1.6vmin;font-size:2.6vmin;padding:1.4vmin 3vmin;font-weight:800}
.btn.on{background:var(--red)}
/* underwear */
.uwimg{max-width:80vw;max-height:52vh;background:#fff;border-radius:2vmin;padding:1.4vmin}
.uwname{font-size:6vmin;font-weight:900}
.uwrole{font-size:3vmin;color:var(--gold)}
.dots{display:flex;gap:1.1vmin;justify-content:center}
.dots i{width:1.6vmin;height:1.6vmin;border-radius:50%;background:#4b3a63}
.dots i.on{background:var(--pink)}
img.sh{max-height:62vh;max-width:50vw;border-radius:2vmin;box-shadow:0 0 8vmin #ff3fa466}
#menuBtn{position:fixed;top:1vmin;left:1vmin;width:7vmin;height:7vmin;opacity:.12;font-size:4vmin;background:none;border:0;color:#fff;z-index:9}
#menu{position:fixed;inset:0;background:#120a1ce8;z-index:8;display:none;padding:3vmin 5vmin;overflow:auto}
#menu.show{display:block}
#menu button{display:block;width:100%;text-align:left;background:#1f1630;color:#fff;border:0;border-radius:1.4vmin;margin:.8vmin 0;padding:1.6vmin 2.4vmin;font-size:2.8vmin;font-weight:600}
#menu button.cur{background:var(--pink)}
#menu .x{background:#3b2c52;text-align:center;font-weight:800}

.igwrap{display:flex;align-items:center;justify-content:center;gap:6vmin;width:100%}
.igside{max-width:42vw}
.story{position:relative;height:80vh;aspect-ratio:9/16;border-radius:2.4vmin;overflow:hidden;background:linear-gradient(160deg,#f58529 0%,#dd2a7b 38%,#8134af 70%,#515bd4 100%);box-shadow:0 0 6vmin #0008;display:flex;flex-direction:column;text-align:left;color:#fff}
.sbar{margin:1.6vmin 1.8vmin 0;height:.5vmin;background:#ffffff55;border-radius:1vmin;overflow:hidden}
.sbar i{display:block;height:100%;width:100%;background:#fff;transform-origin:left;animation:sb 6s linear forwards}
@keyframes sb{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.shead{text-shadow:0 .2vmin 1vmin #000c;display:flex;align-items:center;gap:1.4vmin;padding:1.6vmin 1.8vmin;font-size:2.2vmin}
.shead em{font-style:normal;opacity:.8}
.shead .dots3{margin-left:auto;font-size:2.4vmin;letter-spacing:.2em}
.av{width:5.2vmin;height:5.2vmin;border-radius:50%;background:#fff;color:#c13584;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:2.6vmin}
.sbody{flex:1;display:flex;align-items:center;justify-content:center;padding:3vmin}
.stxt{background:#fff;color:#111;border-radius:1.4vmin;padding:2vmin 2.4vmin;font-weight:700;font-size:3vmin;line-height:1.25;text-align:center;transform:rotate(-2deg);box-shadow:0 .6vmin 2vmin #0004}
.mention{color:#0095f6}
.sfoot{display:flex;align-items:center;gap:1.6vmin;padding:1.6vmin 1.8vmin 2.2vmin}
.reply{flex:1;border:.25vmin solid #fffd;border-radius:6vmin;padding:1.4vmin 2.4vmin;font-size:2.2vmin}
.ico{font-size:3.4vmin}
.rg{display:grid;grid-template-columns:repeat(var(--c),1fr);gap:2vmin;width:95vw}
.rc{background:#1b1526;border:.4vmin solid #3b2c52;border-radius:2vmin;padding:2.2vmin 2.6vmin;text-align:left}
.rc.new{border-color:var(--pink)}
.rl{font-size:2vmin;letter-spacing:.18em;color:var(--pink);font-weight:800;margin-bottom:1vmin}
.rb{font-size:2.6vmin;line-height:1.4}.rb hr{border:0;border-top:1px solid #3b2c52;margin:1.2vmin 0}
.dim{color:var(--mute)}.redt{color:var(--red);letter-spacing:.2em}
#hint{position:fixed;bottom:1.6vmin;left:50%;transform:translateX(-50%);padding:1.1vmin 2.6vmin;border-radius:5vmin;font-weight:900;font-size:2.2vmin;letter-spacing:.12em;z-index:6;white-space:nowrap}
#hint.safe{background:#1f7a4a;color:#fff}
#hint.stop{background:#a1182b;color:#fff}
.rg{align-items:start}.s5 .rb{font-size:2vmin;line-height:1.3}.s5 .rc{padding:1.3vmin 1.8vmin}.s5 .rl{font-size:1.7vmin;margin-bottom:.6vmin}.s5{gap:1.4vmin}
</style></head><body>

<div id="hint"></div>
<button id="menuBtn" aria-label="menu">☰</button>

}
function tick(){const s=S[cur];const cd=$('#cd');if(!cd)return;const ms=untilMs(s.until);let h='';
  if(s.until&&s.cd){h=`${s.cd} · <b class="count-s">${ms>0?fmt(ms):'now'}</b>`}
  if(s.l==='Séance'&&ms!==null){cd.innerHTML=`<div class="count ${ms<60000?'hot':''}">${fmt(ms)}</div><div class="next">${s.cd}</div>`;return}
  cd.innerHTML=h}
setInterval(tick,1000);
function go(n){if(n<0||n>=S.length)return;cur=n;step=0;render()}
function fwd(){go(cur+1)}
function back(){go(cur-1)}
document.addEventListener('click',e=>{
  if(e.target.closest('#menu')||e.target.id==='menuBtn')return;
  const q=e.target.closest('[data-q]');
  if(q){e.stopPropagation();const v=q.dataset.q;if(v==='p'){qp=!qp;localStorage.setItem('sc-qp',qp?'1':'0')}else{qr=Math.max(-1,Math.min(ROUNDS.length-1,qr+(+v)));localStorage.setItem('sc-q',qr)}render();return}
  (e.clientX<innerWidth*.3)?back():fwd()});
$("#menuBtn").onclick=e=>{e.stopPropagation();const m=$("#menu");m.innerHTML=S.map((s,i)=>`<button data-i="${i}" class="${i===cur?'cur':''}">${s.t} · ${s.l}</button>`).join('')+`<button class="x" data-x="1">Close</button>`;m.classList.add('show')};
$("#menu").onclick=e=>{e.stopPropagation();const b=e.target.closest('button');if(!b)return;if(b.dataset.x)$("#menu").classList.remove('show');else{$("#menu").classList.remove('show');go(+b.dataset.i)}};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')fwd();if(e.key==='ArrowLeft')back()});
try{document.addEventListener('click',()=>{if(navigator.wakeLock&&!window._wl){navigator.wakeLock.request('screen').then(w=>{window._wl=w;w.addEventListener('release',()=>window._wl=null)}).catch(()=>{})}},{once:false})}catch(e){}
render();
</script></body></html>
