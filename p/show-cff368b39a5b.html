<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Second Chances Show Screen</title>
<style>
:root{--bg:#120a1c;--bg2:#2a0f3a;--pink:#ff3fa4;--gold:#ffd166;--ink:#fff;--mute:#c9b6d9;--red:#ff4d5e}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,"SF Pro Display","Segoe UI",Helvetica,Arial,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;background:radial-gradient(120% 90% at 50% 0%,var(--bg2),var(--bg) 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:9vmin 6vmin 5vmin}
.scene{display:none;width:100%;height:100%;flex-direction:column;align-items:center;justify-content:center;gap:2.6vmin}
.scene.on{display:flex;animation:in .5s ease}
@keyframes in{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
.tag{font-size:2.6vmin;letter-spacing:.4em;text-transform:uppercase;color:var(--pink);font-weight:800}
.time{font-size:2.6vmin;color:var(--mute);letter-spacing:.15em}
h1{font-size:9vmin;line-height:1.05;font-weight:900;letter-spacing:-.02em}
h2{font-size:7vmin;line-height:1.1;font-weight:850}
.big{font-size:5.2vmin;line-height:1.3;max-width:86vw;font-weight:600}
.mid{font-size:3.6vmin;line-height:1.35;color:var(--mute);max-width:80vw}
.gold{color:var(--gold)}.pink{color:var(--pink)}
.count{font-variant-numeric:tabular-nums;font-size:14vmin;font-weight:900;letter-spacing:.02em;line-height:1}
.count.hot{color:var(--red);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.55}}
.next{font-size:2.8vmin;color:var(--mute)}
.pausebar{position:fixed;top:0;left:0;right:0;background:var(--red);color:#fff;font-weight:900;font-size:3.2vmin;letter-spacing:.2em;padding:1.4vmin;text-align:center;display:none;z-index:5}
.pausebar.show{display:block}
/* evidence cards */
.card{background:#1b1526;border:.5vmin solid #3b2c52;border-radius:2.4vmin;padding:3.2vmin 4vmin;text-align:left;max-width:88vw}
.discord{background:#313338;border-radius:2vmin;padding:3vmin 4vmin;text-align:left;font-size:3.6vmin;line-height:1.5;width:min(82vw,150vmin)}
.discord .d{color:#949ba4;font-size:2.4vmin;text-align:center;border-bottom:1px solid #3f4147;margin-bottom:2vmin;padding-bottom:1vmin}
.discord b{color:#fff}.discord .dim{color:#949ba4}
.news{background:linear-gradient(90deg,#b00020,#e0143c);border-radius:1.6vmin;padding:1.4vmin 3vmin;font-weight:900;letter-spacing:.3em;font-size:3vmin}
.chat{background:#0e0e10;border:1px solid #2d2d33;border-radius:1.6vmin;width:min(84vw,160vmin);height:62vh;text-align:left;padding:2vmin 3vmin;font-size:2.9vmin;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.chat div.m{padding:.5vmin 0;animation:in .3s}
.chat .u{font-weight:800;margin-right:1.2vmin}
.chat .ts{color:#7d7d85;margin-right:1.2vmin;font-size:2.4vmin}
.chat .end{text-align:center;color:var(--red);font-weight:900;letter-spacing:.3em;padding-top:1.6vmin}
.ig{background:linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045);padding:.7vmin;border-radius:3vmin}
.ig div{background:#150d20;border-radius:2.6vmin;padding:3.4vmin 4.4vmin;font-size:4.6vmin;font-weight:700;max-width:80vw}
/* queue */
.qgrid{display:grid;grid-template-columns:18vmin repeat(3,1fr);gap:1.2vmin;width:min(94vw,190vmin);font-size:3.4vmin}
.qgrid .h{font-size:2.6vmin;color:var(--pink);font-weight:800;letter-spacing:.2em;padding:.8vmin}
.qgrid .r{color:var(--mute);font-size:2.4vmin;align-self:center;text-align:left;line-height:1.25}
.qgrid .n{background:#1b1526;border-radius:1.6vmin;padding:1.6vmin;font-weight:800;border:.4vmin solid transparent}
.qgrid .cur{background:var(--pink);color:#fff;border-color:#fff;transform:scale(1.04)}
.qgrid .done{opacity:.28}
.qctl{display:flex;gap:2vmin;align-items:center;margin-top:1vmin}
.btn{background:#3b2c52;color:#fff;border:0;border-radius:1.6vmin;font-size:2.6vmin;padding:1.4vmin 3vmin;font-weight:800}
.btn.on{background:var(--red)}
/* underwear */
.uwimg{max-width:80vw;max-height:52vh;background:#fff;border-radius:2vmin;padding:1.4vmin}
.uwname{font-size:6vmin;font-weight:900}
.uwrole{font-size:3vmin;color:var(--gold)}
.dots{display:flex;gap:1.1vmin;justify-content:center}
.dots i{width:1.6vmin;height:1.6vmin;border-radius:50%;background:#4b3a63}
.dots i.on{background:var(--pink)}
img.sh{max-height:62vh;max-width:50vw;border-radius:2vmin;box-shadow:0 0 8vmin #ff3fa466}
#menuBtn{position:fixed;top:1vmin;left:1vmin;width:7vmin;height:7vmin;opacity:.12;font-size:4vmin;background:none;border:0;color:#fff;z-index:9}
#menu{position:fixed;inset:0;background:#120a1ce8;z-index:8;display:none;padding:3vmin 5vmin;overflow:auto}
#menu.show{display:block}
#menu button{display:block;width:100%;text-align:left;background:#1f1630;color:#fff;border:0;border-radius:1.4vmin;margin:.8vmin 0;padding:1.6vmin 2.4vmin;font-size:2.8vmin;font-weight:600}
#menu button.cur{background:var(--pink)}
#menu .x{background:#3b2c52;text-align:center;font-weight:800}
</style></head><body>
<div id="stage"></div>
<div class="pausebar" id="pause">CONFESSIONALS PAUSED · EVERYONE TO THE WALL</div>
<button id="menuBtn" aria-label="menu">☰</button>
<div id="menu"></div>

{l:"Interview panels",t:"6:05",until:"18:45",h:()=>`<div class="tag">Interview panels</div><h2>The interview panels<br>are open.</h2><div class="mid">Everyone else: mingle, listen, make friends.</div>`,cd:"Flash-forward at 6:45"},
{l:"Flash-forward",t:"6:45",until:"18:50",h:()=>`<div class="tag">Breaking</div><h2>Production has evidence<br>Jannelle <span class="pink">wasn't alone</span><br>when she died.</h2>`,cd:"Mingling opens at 6:50"},
{l:"Mingle and confessionals",t:"6:50",until:"19:05",q:1,h:()=>"",cd:"Drop 1 at 7:05"},
{l:"Drop 1",t:"7:05",until:"19:25",paused:1,h:()=>`<div class="tag">Drop 1 · Evidence</div><div class="mid">Recovered from Jannelle's phone. The call that pulled her out of her match.</div><div class="discord"><div class="d">Discord · Today</div><div><b>📞 sec_admirer_4421</b> started a call that lasted a minute.</div><div class="dim" style="margin-top:1.6vmin">Murder night, mid-match</div><div class="dim" style="margin-top:1.6vmin;font-size:2.6vmin">You cannot reply to this conversation.</div></div>`,cd:"Drop 2 at 7:25"},
{l:"Mingle (after drop 1)",t:"7:10",until:"19:25",q:1,h:()=>"",cd:"Drop 2 at 7:25"},
{l:"Drop 2",t:"7:25",until:"19:35",paused:1,h:()=>`<div class="news">BREAKING NEWS · THE INVESTIGATION</div><div class="big" style="max-width:82vw">The autopsy is final.<br><span class="gold">Cause of death: fall damage.</span><br>Jannelle fell from the roof.</div><div class="mid">Two hotel guests heard a voice yell <b style="color:#fff">“LET GO.”</b> One also heard something about <b style="color:#fff">stars</b>.<br>The lobby camera shows a woman in black leather on one long phone call by the stairwell. She never went up.</div>`,cd:"Drop 3 at 7:35"},
{l:"Drop 3: Mori's stream",t:"7:35",until:"19:40",paused:1,chat:1,h:()=>`<div class="tag">Drop 3 · Recovered from Mori Calliope's livestream</div><div class="chat" id="chat"></div>`,cd:"Séance at 7:40"},
{l:"Drop 3: Instagram story",t:"7:37",until:"19:40",paused:1,h:()=>`<div class="tag">Recovered from Jannelle's phone</div><div class="mid">Her last-ever Instagram story:</div><div class="ig"><div>“I can't believe I did good loving with Mori Calliope!”</div></div><div class="big" style="margin-top:1vmin">Police now believe <span class="pink">Mori Calliope</span><br>is the person who was with her.</div>`,cd:"Séance at 7:40"},
{l:"Séance",t:"7:40",until:"19:50",paused:1,h:()=>`<div class="tag">The séance</div><img class="sh" src="data:image/jpeg;base64,${SH}"><div class="mid">Hand your question to Monica. Sharalyn answers truthfully. Cards addressed to her are read first.</div>`,cd:"Hard stop · Mail call at 7:50"},
{l:"Mail call 1",t:"7:50",until:"20:00",h:()=>`<div class="tag">Mail call</div><h2>Letters from the first round</h2><div class="big">Monica reads the names.<br>Come get your letter.</div><div class="mid">Marc's letter goes to Justin to read aloud.</div>`,cd:"Drop 4 at 8:00"},
{l:"Drop 4",t:"8:00",until:"20:15",paused:1,h:()=>`<div class="tag">Drop 4 · Recovered by production</div><div class="mid">An old Mori stream. Listen closely to the background.</div><div class="big" style="font-size:7vmin">🔊 <span class="gold">faint animal noise</span><br>in the background</div><div class="mid">Whose pet makes noise?</div>`,cd:"Drop 5 at 8:15"},
{l:"Drop 5: the lure",t:"8:15",until:"20:20",paused:1,h:()=>`<div class="tag">Drop 5 · The lure message</div><div class="mid">From sec_admirer_4421, the same account that called her.</div><div class="discord"><div class="d">Discord · Direct message</div><div><b>sec_admirer_4421</b></div><div style="margin-top:1.4vmin">come up to the roof 😘 just you and me. been wanting you since the first night. let's make it official 💍</div></div>`,cd:"The list"},
{l:"Drop 5: the list",t:"8:17",until:"20:30",paused:1,steps:UWLIST.length+1,h:()=>`<div class="tag">Recovered by production</div><div class="big">The list: most of the people<br>Jannelle has slept with.</div><div class="mid" id="uwhint">Tap to read the first name.</div>`,cd:"Final mingling"},
{l:"Final mingling",t:"8:20",until:"20:30",q:1,h:()=>"",cd:"Second round of letters closes at 8:30"},
{l:"Mail call 2",t:"8:35",until:"20:40",h:()=>`<div class="tag">Mail call</div><h2>Round two</h2><div class="big">Monica reads the names.<br>Come get your letter.</div>`,cd:"Proposals at 8:40"},
{l:"Proposals",t:"8:40",until:"20:55",h:()=>`<div class="tag">Proposals</div><h2>Make it count.</h2><div class="big">Say it to their face, or in front of everyone.</div><div class="mid">Vote slips at 8:55.</div>`,cd:"Slips due at 8:55"},
{l:"Slips",t:"8:55",until:"21:00",h:()=>`<div class="tag">Last call</div><h2>Hand in your slip.</h2><div class="big">Who killed Jannelle?<br>Who helped?</div>`,cd:"The reveal at 9:00"},
{l:"The reveal",t:"9:00",until:"21:15",h:()=>`<div class="tag">The finale</div><h1>The truth<br>about Jannelle.</h1><div class="mid">Nobody move.</div>`,cd:""},
{l:"Thank you",t:"9:15",until:"",h:()=>`<div class="tag">Second Chances</div><h1>Thank you for playing.</h1><div class="mid">Success isn't who won. It's how much fun we had.</div>`,cd:""}
];
const $=s=>document.querySelector(s);
let cur=+(localStorage.getItem('sc-scene')||0),step=0,qr=+(localStorage.getItem('sc-q')||-1),chatTimer=null;
let qp=localStorage.getItem('sc-qp')==='1';
const st=$("#stage");
S.forEach((s,i)=>{const d=document.createElement('div');d.className='scene';d.id='s'+i;st.appendChild(d)});
function untilMs(h){if(!h)return null;const [a,b]=h.split(':').map(Number);const d=new Date();d.setHours(a,b,0,0);return d-Date.now()}
function fmt(ms){if(ms<0)ms=0;const t=Math.round(ms/1000),h=Math.floor(t/3600),m=Math.floor(t/60)%60,s=t%60;return h?h+":"+String(m).padStart(2,'0')+":"+String(s).padStart(2,'0'):m+":"+String(s).padStart(2,'0')}
function queueHTML(){
  let g=`<div class="qgrid"><div></div>${[1,2,3].map(n=>`<div class="h">ROOM ${n}</div>`).join('')}`;
  ROUNDS.forEach((r,i)=>{const c=i===qr?'cur':(i<qr?'done':'');g+=`<div class="r">${r[0]}<br>${r[1]}</div>`+r[2].map(n=>`<div class="n ${c}">${n}</div>`).join('')});
  g+='</div>';
  const cur_=qr>=0?`Now in the confessionals: <b class="pink">${ROUNDS[qr][0]}</b>`:`Confessionals open at 6:50`;
  return `<div class="tag">Confessionals</div><div class="big" style="font-size:4vmin">${cur_}</div>${g}<div class="mid" style="font-size:2.8vmin">Open your bagged journal. About 2 minutes. Then tell the next person in your room.</div><div class="qctl"><button class="btn" data-q="-1">◀ Round</button><button class="btn" data-q="1">Round ▶</button><button class="btn ${qp?'on':''}" data-q="p">${qp?'Resume':'Pause'} queue</button></div>`;
}
function render(){
  const s=S[cur];document.querySelectorAll('.scene').forEach((e,i)=>e.classList.toggle('on',i===cur));
  const el=$('#s'+cur);
  clearInterval(chatTimer);
  if(s.q){el.innerHTML=queueHTML()+`<div class="next" id="cd"></div>`}
  else{el.innerHTML=s.h()+`<div class="next" id="cd"></div>`}
  $("#pause").classList.toggle('show',!!(s.paused||(s.q&&qp)));
  if(s.chat){const c=$('#chat');let i=0;const add=()=>{if(i<CHAT.length){const m=CHAT[i++];const d=document.createElement('div');d.className='m';d.innerHTML=`<span class="ts">${m[0]}</span><span class="u" style="color:${m[3]?'#ffd166':COLORS[m[1].length%COLORS.length]}">${m[1]}</span>${m[2]}`;c.appendChild(d)}else if(i===CHAT.length){i++;const d=document.createElement('div');d.className='end';d.textContent='STREAM ENDED';c.appendChild(d);clearInterval(chatTimer)}};add();chatTimer=setInterval(add,1100)}
  if(s.steps){if(step>0&&step<=UWLIST.length){const[n,r]=UWLIST[step-1];el.innerHTML=`<div class="tag">The list · ${step} of ${UWLIST.length}</div><img class="uwimg" src="data:image/jpeg;base64,${UW[n]}"><div class="uwname">${n}</div><div class="uwrole">${r}</div><div class="dots">${UWLIST.map((_,i)=>`<i class="${i<step?'on':''}"></i>`).join('')}</div><div class="next" id="cd"></div>`}else if(step>UWLIST.length){el.innerHTML=`<div class="tag">Recovered by production</div><div class="big">Five people aren't on the list.</div><div class="mid">Lily, Erica, Joanna, John and Ragini.<br>Anyone want to say why?</div><div class="dots">${UWLIST.map(()=>`<i class="on"></i>`).join('')}</div><div class="next" id="cd"></div>`}}
  localStorage.setItem('sc-scene',cur);
  tick();
}
function tick(){const s=S[cur];const cd=$('#cd');if(!cd)return;const ms=untilMs(s.until);let h='';
  if(s.until&&s.cd){h=`${s.cd} · <b class="count-s">${ms>0?fmt(ms):'now'}</b>`}
  if(s.l==='Séance'&&ms!==null){cd.innerHTML=`<div class="count ${ms<60000?'hot':''}">${fmt(ms)}</div><div class="next">${s.cd}</div>`;return}
  cd.innerHTML=h}
setInterval(tick,1000);
function go(n){if(n<0||n>=S.length)return;cur=n;step=0;render()}
function fwd(){const s=S[cur];if(s.steps&&step<s.steps){step++;render();return}go(cur+1)}
function back(){const s=S[cur];if(s.steps&&step>0){step--;render();return}go(cur-1)}
document.addEventListener('click',e=>{
  if(e.target.closest('#menu')||e.target.id==='menuBtn')return;
  const q=e.target.closest('[data-q]');
  if(q){e.stopPropagation();const v=q.dataset.q;if(v==='p'){qp=!qp;localStorage.setItem('sc-qp',qp?'1':'0')}else{qr=Math.max(-1,Math.min(ROUNDS.length-1,qr+(+v)));localStorage.setItem('sc-q',qr)}render();return}
  (e.clientX<innerWidth*.3)?back():fwd()});
$("#menuBtn").onclick=e=>{e.stopPropagation();const m=$("#menu");m.innerHTML=S.map((s,i)=>`<button data-i="${i}" class="${i===cur?'cur':''}">${s.t} · ${s.l}</button>`).join('')+`<button class="x" data-x="1">Close</button>`;m.classList.add('show')};
$("#menu").onclick=e=>{e.stopPropagation();const b=e.target.closest('button');if(!b)return;if(b.dataset.x)$("#menu").classList.remove('show');else{$("#menu").classList.remove('show');go(+b.dataset.i)}};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')fwd();if(e.key==='ArrowLeft')back()});
try{document.addEventListener('click',()=>{if(navigator.wakeLock&&!window._wl){navigator.wakeLock.request('screen').then(w=>{window._wl=w;w.addEventListener('release',()=>window._wl=null)}).catch(()=>{})}},{once:false})}catch(e){}
render();
</script></body></html>
