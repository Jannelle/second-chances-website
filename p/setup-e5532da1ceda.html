<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><title>Second Chances: Setup checklist</title>
<style>:root{--bg:#fff7fb;--ink:#2a1630;--pink:#d81b7f;--line:#eedbe8;--card:#fff}@media(prefers-color-scheme:dark){:root{--bg:#1c1220;--ink:#f3e8f5;--pink:#ff5cb0;--line:#3a2742;--card:#261a2b}}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 -apple-system,"Segoe UI",Helvetica,Arial,sans-serif}main{max-width:700px;margin:0 auto;padding:18px 16px 50px}
h1{color:var(--pink);font-size:26px;margin:.2em 0}h2{color:var(--pink);font-size:18px;margin:1.4em 0 .4em}p.sub{margin:0 0 6px;opacity:.75}
label{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0}
input{width:24px;height:24px;flex:none;margin-top:2px;accent-color:var(--pink)}label.done{opacity:.5;text-decoration:line-through}
a{color:var(--pink);font-weight:600}</style></head><body><main>
<h1>Setup checklist</h1><p class="sub">Tap to tick items off. <a href="schedule-9a74894471b9.html">Open the schedule &rarr;</a> <a href="#" id="reset">Reset</a></p>
<h2>1. Walls and rooms (first 20 minutes)</h2><label><input type="checkbox" data-i="1"><span>Pick the evidence wall. Set the framed memorial photo with flowers and a candle, covered or face-down.</span></label><label><input type="checkbox" data-i="2"><span>Put the drop 1 sheet (the call log) where you can pin it at 7:05. Keep the other drop sheets in order, face-down: stream chat, Instagram story, animal noise, lure text, underwear list.</span></label><label><input type="checkbox" data-i="3"><span>Put the pets display on a wall.</span></label><label><input type="checkbox" data-i="4"><span>Set up the seance table: candle (phone flashlight is fine), Sharalyn&#x27;s drawing, Sharalyn&#x27;s cheat sheet for Monica.</span></label><label><input type="checkbox" data-i="5"><span>Pick a spot where you can black out the lights for the 6:45 flash-forward.</span></label><h2>2. Letters</h2><label><input type="checkbox" data-i="6"><span>Set up one letter box where everyone can reach it. Put pencils next to it.</span></label><label><input type="checkbox" data-i="7"><span>Cut the love letters in half so each player has two cards (one per mail call).</span></label><label><input type="checkbox" data-i="8"><span>Put Marc&#x27;s pink letter in the box, addressed to Marc (Monica gives it to Justin to read to him at mail call 1).</span></label><label><input type="checkbox" data-i="9"><span>Monica has a place to sort cards into piles by name (Jannelle sorts round 1 during the seance; both of you sort 8:30 to 8:35).</span></label><h2>3. Confessional rooms</h2><label><input type="checkbox" data-i="10"><span>Set up three rooms, each with a phone on a stand recording and a chair. Kayla is room 1, Lily is room 2.</span></label><label><input type="checkbox" data-i="11"><span>Put each journal in a bag with the player&#x27;s name. Keep the bags in one place near the rooms.</span></label><label><input type="checkbox" data-i="12"><span>Monica has the queue order: R1 Kayla, Ragini, Marc (6:50). R2 Lily, Vivian, Shevy (6:55). R3 Justin, Erica, Johnny (7:00). R4 Joanna, John, Katie (7:10). R5 Arnel, Crystal, Kanita (7:17).</span></label><label><input type="checkbox" data-i="13"><span>Optional: write the order on a card and tape it by the rooms.</span></label><h2>4. Gear</h2><label><input type="checkbox" data-i="14"><span>Headset, lanyard and clipboard somewhere you can reach in the dark.</span></label><label><input type="checkbox" data-i="15"><span>Open the schedule page on your phone; open the viewer on Monica&#x27;s iPad. Leave the tabs open.</span></label><label><input type="checkbox" data-i="16"><span>Monica&#x27;s phone alarms: 6:05, 6:45, 6:50, 7:05, 7:25, 7:35, 7:40, 7:50, 8:00, 8:15, 8:30, 8:35, 8:40, 8:55.</span></label><label><input type="checkbox" data-i="17"><span>Music for the flash-forward (optional) and a visible timer for the 8:55 slips.</span></label><label><input type="checkbox" data-i="18"><span>Phones on chargers.</span></label><h2>5. Food and tables</h2><label><input type="checkbox" data-i="19"><span>Food out by 6:00.</span></label><label><input type="checkbox" data-i="20"><span>Someone ready to clear plates and drinks at 6:45 to 6:50.</span></label><label><input type="checkbox" data-i="21"><span>Secret-guess sheets out (15 copies, one per player) with a pen each.</span></label><label><input type="checkbox" data-i="22"><span>Accusation slips ready for 8:55; space for the proposals.</span></label><h2>6. Last 15 minutes before 5:30</h2><label><input type="checkbox" data-i="23"><span>Walk-through with Monica: read the schedule top to bottom.</span></label><label><input type="checkbox" data-i="24"><span>Agree who says what: 6:00 welcome and love letters, 6:50 host line, each pause, 7:40 seance, 7:50 mail call.</span></label><label><input type="checkbox" data-i="25"><span>Hand-out items ready: cards, cheat sheets, packets, index cards or love letters, pencils.</span></label><label><input type="checkbox" data-i="26"><span>Guests arrive out of character at 5:30.</span></label></main><script>
(function(){var K="sc-setup-v1",st={};try{st=JSON.parse(localStorage.getItem(K)||"{}")}catch(e){}
function save(){try{localStorage.setItem(K,JSON.stringify(st))}catch(e){}}
document.querySelectorAll("input[type=checkbox]").forEach(function(c){var i=c.dataset.i;if(st[i]){c.checked=true;c.parentNode.classList.add("done")}
c.addEventListener("change",function(){st[i]=c.checked;c.parentNode.classList.toggle("done",c.checked);save()})});
document.getElementById("reset").addEventListener("click",function(e){e.preventDefault();st={};save();document.querySelectorAll("input[type=checkbox]").forEach(function(c){c.checked=false;c.parentNode.classList.remove("done")})});})();
</script></body></html>
